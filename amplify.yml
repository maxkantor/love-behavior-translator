version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json not found, using npm install"
            npm install
          fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*


